  <head>
    <script>
      // Fix for legacy polyfills/extensions trying to overwrite window.fetch
      const originalFetch = window.fetch;
      Object.defineProperty(window, 'fetch', {
        configurable: true,
        enumerable: true,
        get: () => originalFetch,
        set: (val) => { 
          console.warn('Blocked attempt to overwrite window.fetch', val); 
        }
      });
    </script>
